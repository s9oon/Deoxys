name: CD (backend)

# Builds the backend Docker image and pushes it to GHCR
# whenever backend changes land on main.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cd-backend.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write access to packages to push to ghcr.io.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root (the Cargo workspace); the Dockerfile lives in backend/.
      # Image names on GHCR must be lowercase.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/s9oon/deoxys-backend:latest
            ghcr.io/s9oon/deoxys-backend:${{ github.sha }}
