name: CD (backend)

# Builds the backend Docker image and pushes it to GHCR
# whenever backend changes land on main.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cd-backend.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write access to packages to push to ghcr.io.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on GHCR must be lowercase.
      # Result: ghcr.io/s9oon/deoxys-backend:latest and :<commit sha>
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/s9oon/deoxys-backend:latest
            ghcr.io/s9oon/deoxys-backend:${{ github.sha }}
