name: CI (backend)

# Runs on every push and pull request that touches the backend
# or anything it depends on in the workspace.
on:
  push:
    paths:
      - "backend/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "desktop/src/ipc/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "desktop/src/ipc/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches target/ and ~/.cargo between runs so builds are faster.
      - uses: Swatinem/rust-cache@v2

      # -p backend: only the backend (and shared), not the Tauri app.
      - run: cargo build --locked -p backend
      - run: cargo test --locked -p backend -p shared

      # Fails if desktop/src/ipc is out of date with shared/.
      # Regenerates the TypeScript types, then errors if that changed or added any file.
      # Fix: run `cargo test -p shared --features ts` locally and commit the result.
      - run: cargo test --locked -p shared --features ts
      - name: Check TypeScript types are up to date
        run: |
          if [ -n "$(git status --porcelain desktop/src/ipc)" ]; then
            git status --short desktop/src/ipc
            git diff desktop/src/ipc
            exit 1
          fi
