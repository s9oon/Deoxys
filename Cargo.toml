[workspace]
resolver = "3"
members = ["backend", "shared", "desktop/src-tauri"]

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true