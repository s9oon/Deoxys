apiVersion: apps/v1
kind: Deployment
metadata:
  name: deoxys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deoxys          
  template: 
    metadata:
      labels:
        app: deoxys       
    spec:
      containers:
        - name: backend
          image: ghcr.io/s9oon/deoxys-backend:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deoxys-db
                  key: DATABASE_URL
          ports:
            - containerPort: 3000